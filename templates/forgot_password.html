<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — AI Meeting Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div id="toast-container" class="toast-container"></div>

<div class="auth-page">
  <div class="auth-dots"></div>

  <div class="auth-card">
    <a href="{{ url_for('auth.login_page') }}" class="auth-back-link"><i class="fa-solid fa-arrow-left"></i> Back to log in</a>

    <div class="auth-logo">
      <div class="logo-icon"><i class="fa-solid fa-waveform-lines"></i></div>
      <span>AI Meeting Notes</span>
    </div>

    <h1>Forgot Password</h1>
    <p class="auth-subtitle">Enter the email on your account and we'll send you a reset link.</p>

    <div id="forgot-form-wrapper">
      <form id="forgot-form" novalidate>
        <label for="email">Email*</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <button type="submit" class="btn btn-primary auth-submit" id="forgot-submit">Send Reset Link</button>
      </form>
    </div>

    <div id="forgot-success" class="hidden">
      <div class="auth-success-box">
        <i class="fa-solid fa-circle-check"></i>
        <span>If an account exists for that email, a reset link is on its way. It expires in 1 hour — check your inbox (and spam folder).</span>
      </div>
    </div>

    <p class="auth-footer-text">Remembered it? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
