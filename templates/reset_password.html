<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — AI Meeting Notes</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body class="auth-body">

<div id="toast-container" class="toast-container"></div>

<div class="auth-page">
  <div class="auth-dots"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i class="fa-solid fa-waveform-lines"></i></div>
      <span>AI Meeting Notes</span>
    </div>

    {% if token %}
      <h1>Reset Password</h1>
      <p class="auth-subtitle">Choose a new password for your account.</p>

      <form id="reset-form" novalidate data-token="{{ token }}">
        <label for="password">New Password*</label>
        <div class="password-field">
          <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
          <button type="button" class="toggle-password" id="toggle-password" tabindex="-1"><i class="fa-regular fa-eye"></i></button>
        </div>
        <p class="field-hint">At least 8 characters.</p>

        <label for="confirm-password">Confirm New Password*</label>
        <input type="password" id="confirm-password" name="confirm-password" required autocomplete="new-password" minlength="8">

        <button type="submit" class="btn btn-primary auth-submit" id="reset-submit">Reset Password</button>
      </form>
    {% else %}
      <h1>Link Expired</h1>
      <div class="auth-success-box" style="background:#fff5f5;border-color:#fecaca;color:#b91c1c;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>This password reset link is invalid or has expired. Request a new one below.</span>
      </div>
      <a href="{{ url_for('auth.forgot_password_page') }}" class="btn btn-primary auth-submit" style="margin-top:20px; text-decoration:none;">
        Request New Link
      </a>
    {% endif %}

    <p class="auth-footer-text">Remembered it? <a href="{{ url_for('auth.login_page') }}">Log in</a></p>
  </div>
</div>

<script src="{{ url_for('static', filename='js/ui.js') }}"></script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
